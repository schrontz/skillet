<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillet – Koch-Skills</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2420;
    --muted: #786f64;
    --accent: #b5522f;
    --accent-light: #f1d9cd;
    --ok: #4a7c59;
    --warn: #c9973a;
    --border: #e6ded3;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  nav {
    display: flex; gap: 8px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border); padding-bottom: 12px;
  }
  nav button {
    background: none; border: none; padding: 8px 14px; border-radius: 8px;
    font-size: 0.95rem; cursor: pointer; color: var(--muted);
  }
  nav button.active { background: var(--accent); color: white; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  select, textarea, button.primary {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); font-size: 1rem; font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; margin-top: 10px; }
  button.primary {
    background: var(--accent); color: white; border: none;
    margin-top: 14px; cursor: pointer; font-weight: 600;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .kriterium { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.92rem; border-bottom: 1px solid var(--border); }
  .kriterium:last-child { border-bottom: none; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
  .badge.erfuellt { background: #dcece0; color: var(--ok); }
  .badge.unklar { background: #f5ecd8; color: var(--warn); }
  .badge.nicht_erfuellt { background: #f4dcd6; color: var(--accent); }
  .fehler-liste { background: #fdf4ef; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 0.9rem; }
  .rueckfrage-box { background: var(--accent-light); border-radius: 8px; padding: 14px; margin-top: 14px; }
  .progress-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .progress-item:last-child { border-bottom: none; }
  .level-dots { display: flex; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dot.filled { background: var(--accent); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .status-line { margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍳 Skillet</h1>
  <div class="subtitle">Koch-Skills reflektieren und wachsen sehen</div>

  <nav>
    <button id="tab-reflect" class="active" onclick="showTab('reflect')">Reflektieren</button>
    <button id="tab-recipes" onclick="showTab('recipes')">Rezepte</button>
    <button id="tab-progress" onclick="showTab('progress')">Fortschritt</button>
    <button id="tab-history" onclick="showTab('history')">Verlauf</button>
  </nav>

  <!-- REFLECT VIEW -->
  <div id="view-reflect">
    <div class="card">
      <label for="reflect-recipe-select">Rezept (optional)</label>
      <select id="reflect-recipe-select" onchange="onReflectRecipeChange()">
        <option value="">Kein Rezept / freie Auswahl</option>
      </select>

      <div id="technique-select-wrapper" style="margin-top:14px;">
        <label for="technique-select">Technik</label>
        <select id="technique-select" onchange="onTechniqueSelectChange()">
          <option value="">Automatisch erkennen lassen</option>
        </select>
      </div>
      <div id="technique-fixed-label" style="display:none; margin-top:14px;">
        <label>Technik</label>
        <div style="padding:10px 12px; background: var(--accent-light); border-radius:8px; font-weight:600;"></div>
      </div>

      <div id="auto-titel-wrapper" style="margin-top:14px;">
        <label for="auto-titel-input">Titel (optional, nur falls kein Rezept gewählt)</label>
        <input type="text" id="auto-titel-input" placeholder="z. B. Spontan gekocht"
          style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:1rem; font-family:inherit;">
      </div>

      <label style="margin-top:14px;">Was hast du gemacht?</label>
      <textarea id="beschreibung" placeholder="Beschreibe, was du gemacht und beobachtet hast..."></textarea>

      <button class="primary" id="submit-btn" onclick="submitReflection()">Absenden</button>
      <div class="status-line" id="status-line"></div>
    </div>

    <div id="auto-detect-info" class="muted" style="padding:0 4px;"></div>
    <div id="reflect-vorschlag-card"></div>

    <div id="result-card"></div>
  </div>

  <!-- RECIPES VIEW -->
  <div id="view-recipes" style="display:none;">
    <div class="card">
      <label for="import-url-input">Von URL importieren</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="import-url-input" placeholder="https://..."
          style="flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:1rem; font-family:inherit;">
        <button class="primary" style="width:auto; padding:10px 18px; margin-top:0;" onclick="importRecipeFromUrl()">Importieren</button>
      </div>
      <div class="status-line" id="import-status-line"></div>
    </div>

    <div class="card">
      <div id="edit-mode-banner" style="display:none; background: var(--accent-light); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:0.9rem;">
        Du bearbeitest eine Kopie von "<span id="edit-mode-original-title"></span>". Wird als neues, eigenständiges Rezept gespeichert.
        <span id="edit-mode-mengen-hinweis" class="muted" style="display:block; font-size:0.8rem; margin-top:4px;"></span>
        <a href="#" onclick="cancelEditCopy(); return false;" style="color: var(--accent); margin-left:8px;">Abbrechen</a>
      </div>
      <label for="recipe-titel-input">Titel</label>
      <input type="text" id="recipe-titel-input" placeholder="z. B. Rührei mit Speck"
        style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:1rem; font-family:inherit;">

      <label style="margin-top:14px;">Zutaten</label>
      <textarea id="recipe-zutaten" placeholder="3 Eier, 50g Speckwürfel, Butter, Salz, Pfeffer..."></textarea>

      <label style="margin-top:14px;">Portionen (optional, für Mengenumrechnung)</label>
      <input type="number" id="recipe-portionen-input" min="1" placeholder="z. B. 4"
        style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); font-size:1rem; font-family:inherit;">

      <label style="margin-top:14px;">Anleitung</label>
      <textarea id="recipe-anleitung" placeholder="Speck in der Pfanne knusprig braten, Eier verquirlen..."></textarea>

      <button class="primary" id="recipe-submit-btn" onclick="submitRecipe()">Rezept speichern</button>
      <div class="status-line" id="recipe-status-line"></div>
    </div>

    <div id="detect-card"></div>

    <div class="card">
      <div class="muted" style="margin-bottom:10px;">Deine Rezepte</div>
      <div id="recipe-list"><div class="muted">Lade Rezepte...</div></div>
    </div>
  </div>

  <!-- PROGRESS VIEW -->
  <div id="view-progress" style="display:none;">
    <div class="card" id="progress-list">
      <div class="muted">Lade Fortschritt...</div>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" style="display:none;">
    <div class="card" id="history-list">
      <div class="muted">Lade Verlauf...</div>
    </div>
  </div>
</div>

<script>
  // ==== KONFIGURATION: hier deine Werte eintragen ====
  const SUPABASE_URL = "https://isqbuagacqnmeephathu.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzcWJ1YWdhY3FubWVlcGhhdGh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjU4MTcsImV4cCI6MjEwMTA0MTgxN30.pcRqIk3DMfhCsOgrln56qAnyNJBlJIG0shmy69TlREA";
  // =====================================================

  let techniques = [];
  let currentReflectionId = null;
  let currentTechniqueId = null;
  let currentReflectRecipeId = null;

  // ---- Tabs ----
  function showTab(tab) {
    document.getElementById('view-reflect').style.display = tab === 'reflect' ? 'block' : 'none';
    document.getElementById('view-recipes').style.display = tab === 'recipes' ? 'block' : 'none';
    document.getElementById('view-progress').style.display = tab === 'progress' ? 'block' : 'none';
    document.getElementById('view-history').style.display = tab === 'history' ? 'block' : 'none';
    document.getElementById('tab-reflect').classList.toggle('active', tab === 'reflect');
    document.getElementById('tab-recipes').classList.toggle('active', tab === 'recipes');
    document.getElementById('tab-progress').classList.toggle('active', tab === 'progress');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
    if (tab === 'progress') loadProgress();
    if (tab === 'recipes') loadRecipes();
    if (tab === 'reflect') loadRecipesForReflect();
    if (tab === 'history') loadHistory();
  }

  // ---- Rezept von URL importieren, bestehendes Formular befüllen ----
  let pendingImportUrl = null;
  let pendingZutatenStrukturiert = null;
  let pendingBasisPortionen = null;

  async function importRecipeFromUrl() {
    const url = document.getElementById('import-url-input').value.trim();
    if (!url) return;

    const statusLine = document.getElementById('import-status-line');
    statusLine.textContent = "Importiere...";

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/import-recipe`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (data.error) {
        statusLine.textContent = "Fehler: " + data.error;
        return;
      }

      document.getElementById('recipe-titel-input').value = data.titel || "";
      document.getElementById('recipe-zutaten').value = data.zutaten || "";
      document.getElementById('recipe-anleitung').value = data.anleitung || "";
      document.getElementById('recipe-portionen-input').value = data.basisPortionen || "";
      pendingImportUrl = url;
      pendingZutatenStrukturiert = data.zutatenStrukturiert || null;
      pendingBasisPortionen = data.basisPortionen || null;

      const quelle = data.source === "structured" ? "strukturierte Daten" : "KI-Extraktion";
      statusLine.textContent = `Importiert (${quelle}). Bitte prüfen und ggf. anpassen, dann unten speichern.`;
      document.getElementById('import-url-input').value = "";
    } catch (e) {
      statusLine.textContent = "Verbindungsfehler: " + e.message;
    }
  }

  // ---- Rezept speichern ----
  async function submitRecipe() {
    const titel = document.getElementById('recipe-titel-input').value.trim();
    const zutaten = document.getElementById('recipe-zutaten').value.trim();
    const anleitung = document.getElementById('recipe-anleitung').value.trim();
    if (!titel) return;

    const btn = document.getElementById('recipe-submit-btn');
    const statusLine = document.getElementById('recipe-status-line');
    btn.disabled = true;
    statusLine.textContent = "Speichere...";

    try {
      let kopieVonId = editingCopyOf ? editingCopyOf.id : null;
      let hinweisOriginalWeg = false;

      let res = await insertRecipe(titel, zutaten, anleitung, kopieVonId);

      if (!res.ok) {
        const errText = await res.text();
        const isFkFehler = errText.includes('recipes_kopie_von_fkey') || errText.includes('23503');

        if (isFkFehler && kopieVonId) {
          // Original wurde inzwischen gelöscht - ohne Verweis nochmal versuchen
          hinweisOriginalWeg = true;
          res = await insertRecipe(titel, zutaten, anleitung, null);
        }

        if (!res.ok) {
          const err = await res.text();
          statusLine.textContent = "Fehler: " + err;
          btn.disabled = false;
          return;
        }
      }

      const [savedRecipe] = await res.json();
      document.getElementById('recipe-titel-input').value = "";
      document.getElementById('recipe-zutaten').value = "";
      document.getElementById('recipe-anleitung').value = "";
      document.getElementById('recipe-portionen-input').value = "";
      document.getElementById('edit-mode-banner').style.display = 'none';
      document.getElementById('edit-mode-mengen-hinweis').textContent = '';
      editingCopyOf = null;
      pendingImportUrl = null;
      pendingZutatenStrukturiert = null;
      pendingBasisPortionen = null;
      statusLine.textContent = hinweisOriginalWeg
        ? "Original wurde inzwischen gelöscht - als eigenständiges Rezept gespeichert. Erkenne Techniken..."
        : "Gespeichert! Erkenne verwendete Techniken...";
      loadRecipes();

      await detectAndConfirmTechniques(savedRecipe, titel, zutaten, anleitung);
      statusLine.textContent = hinweisOriginalWeg ? "Gespeichert (ohne Kopie-Verweis, Original war weg)." : "Gespeichert!";
    } catch (e) {
      statusLine.textContent = "Verbindungsfehler: " + e.message;
    }
    btn.disabled = false;
  }

  // ---- Hilfsfunktion: Insert-Request für ein Rezept ----
  function insertRecipe(titel, zutaten, anleitung, kopieVonId) {
    const manuellePortionen = document.getElementById('recipe-portionen-input').value;
    const zutatenUnveraendert = editingCopyOf && editingCopyOf.original_zutaten_text === zutaten;
    return fetch(`${SUPABASE_URL}/rest/v1/recipes`, {
      method: "POST",
      headers: {
        apikey: ANON_KEY,
        Authorization: `Bearer ${ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        titel,
        zutaten,
        anleitung,
        kopie_von: kopieVonId,
        quelle_url: editingCopyOf ? editingCopyOf.quelle_url : (pendingImportUrl || null),
        basis_portionen: pendingBasisPortionen || (manuellePortionen ? parseInt(manuellePortionen, 10) : null),
        zutaten_strukturiert: pendingZutatenStrukturiert || (zutatenUnveraendert ? editingCopyOf.zutaten_strukturiert : null)
      })
    });
  }

  // ---- Techniken erkennen lassen und zur Bestätigung anzeigen ----
  async function detectAndConfirmTechniques(recipe, titel, zutaten, anleitung) {
    const detectCard = document.getElementById('detect-card');
    detectCard.innerHTML = `<div class="card muted">Techniken werden erkannt...</div>`;

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/detect-techniques`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ recipe_id: recipe.id, titel, zutaten, anleitung })
      });
      const data = await res.json();

      if (data.error) {
        detectCard.innerHTML = `<div class="card">Erkennung fehlgeschlagen: ${data.error}</div>`;
        return;
      }

      const erkannt = new Set(data.erkannte_technik_ids || []);
      // techniques ist bereits global geladen (aus loadTechniques)
      detectCard.innerHTML = `
        <div class="card">
          <div style="margin-bottom:10px;">Erkannte Techniken für <strong>${titel}</strong> – bitte prüfen:</div>
          ${techniques.map(t => `
            <label style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:0.92rem; cursor:pointer;">
              <input type="checkbox" class="detect-checkbox" value="${t.id}" ${erkannt.has(t.id) ? 'checked' : ''}>
              ${t.name}
            </label>
          `).join('')}
          <button class="primary" onclick="confirmTechniques('${recipe.id}')">Bestätigen</button>
        </div>
      `;

      if (data.neue_technik_vorschlag) {
        renderNeueTechnikVorschlag(data.neue_technik_vorschlag, recipe.id);
      }
    } catch (e) {
      detectCard.innerHTML = `<div class="card">Verbindungsfehler bei der Erkennung: ${e.message}</div>`;
    }
  }

  // ---- Vorschlag für neue Technik anzeigen (Anlegen/Ignorieren) ----
  function renderNeueTechnikVorschlag(vorschlag, recipeId, containerId = 'detect-card') {
    const box = document.createElement('div');
    box.className = 'card';
    box.id = 'neue-technik-card';
    box.innerHTML = `
      <div style="margin-bottom:8px;">💡 <strong>Neue Technik vorgeschlagen: ${vorschlag.name}</strong></div>
      <div class="muted" style="margin-bottom:14px;">${vorschlag.begruendung}</div>
      <div style="display:flex; gap:8px;">
        <button class="primary" style="width:auto; flex:1;" onclick="generateTechniqueSteckbrief('${vorschlag.name.replace(/'/g, "\\'")}', '${recipeId}')">Steckbrief erstellen</button>
        <button style="width:auto; flex:1; background:none; border:1px solid var(--border); border-radius:8px; cursor:pointer;" onclick="document.getElementById('neue-technik-card').remove()">Ignorieren</button>
      </div>
    `;
    document.getElementById(containerId).appendChild(box);
  }

  // ---- Steckbrief-Entwurf generieren lassen (nutzt B3-Prompt via Edge Function) ----
  async function generateTechniqueSteckbrief(name, recipeId) {
    const box = document.getElementById('neue-technik-card');
    box.innerHTML = `<div class="muted">Steckbrief wird erstellt...</div>`;

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/generate-technique`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ name })
      });
      const steckbrief = await res.json();

      if (steckbrief.error) {
        box.innerHTML = `<div>Fehler: ${steckbrief.error}</div>`;
        return;
      }

      box.innerHTML = `
        <div style="margin-bottom:8px;"><strong>${steckbrief.name}</strong></div>
        ${steckbrief.root_kategorie
          ? `<div class="muted" style="margin-bottom:8px;">Kategorie: ${steckbrief.root_kategorie}</div>`
          : `<div class="fehler-liste" style="margin-bottom:8px;">Keine Root-Kategorie passt: ${steckbrief.root_kategorie_hinweis || 'kein Hinweis angegeben'}</div>`}
        <div class="muted" style="margin-bottom:10px;">${steckbrief.kurzbeschreibung}</div>
        <div style="font-size:0.88rem; font-weight:600; margin-top:8px;">Kernkriterien</div>
        ${steckbrief.kernkriterien.map(k => `<div class="kriterium"><span>${k}</span></div>`).join('')}
        <div style="font-size:0.88rem; font-weight:600; margin-top:10px;">Typische Fehler</div>
        <div class="fehler-liste">${steckbrief.typische_fehler.join(' ')}</div>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="primary" style="width:auto; flex:1;" id="save-technique-btn">Speichern</button>
          <button style="width:auto; flex:1; background:none; border:1px solid var(--border); border-radius:8px; cursor:pointer;" onclick="document.getElementById('neue-technik-card').remove()">Verwerfen</button>
        </div>
      `;
      document.getElementById('save-technique-btn').onclick = () => saveNewTechnique(steckbrief, recipeId);
    } catch (e) {
      box.innerHTML = `<div>Verbindungsfehler: ${e.message}</div>`;
    }
  }

  // ---- Neue Technik final speichern + dem Rezept zuordnen ----
  async function saveNewTechnique(steckbrief, recipeId) {
    const box = document.getElementById('neue-technik-card');
    box.innerHTML = `<div class="muted">Speichere...</div>`;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/techniques`, {
        method: "POST",
        headers: {
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({
          name: steckbrief.name,
          kurzbeschreibung: steckbrief.kurzbeschreibung,
          kernkriterien: steckbrief.kernkriterien,
          typische_fehler: steckbrief.typische_fehler,
          voraussetzungen: steckbrief.voraussetzungen || [],
          root_kategorie: steckbrief.root_kategorie || null
        })
      });
      const [newTechnique] = await res.json();

      await fetch(`${SUPABASE_URL}/rest/v1/recipe_techniques`, {
        method: "POST",
        headers: {
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({ recipe_id: recipeId, technique_id: newTechnique.id })
      });

      await loadTechniques(); // globale Liste aktualisieren, damit sie überall auftaucht
      box.innerHTML = `<div class="muted">✅ "${newTechnique.name}" wurde angelegt und zugeordnet.</div>`;
    } catch (e) {
      box.innerHTML = `<div>Fehler beim Speichern: ${e.message}</div>`;
    }
  }

  // ---- Bestätigte Techniken in recipe_techniques speichern ----
  async function confirmTechniques(recipeId) {
    const checked = Array.from(document.querySelectorAll('.detect-checkbox:checked')).map(cb => cb.value);
    const rows = checked.map(technique_id => ({ recipe_id: recipeId, technique_id }));

    const detectCard = document.getElementById('detect-card');

    if (rows.length === 0) {
      detectCard.innerHTML = `<div class="card muted">Keine Techniken zugeordnet.</div>`;
      return;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/recipe_techniques`, {
        method: "POST",
        headers: {
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify(rows)
      });

      if (!res.ok) {
        const err = await res.text();
        detectCard.innerHTML = `<div class="card">Fehler beim Speichern: ${err}</div>`;
        return;
      }

      detectCard.innerHTML = `<div class="card muted">✅ ${rows.length} Technik(en) zugeordnet.</div>`;
    } catch (e) {
      detectCard.innerHTML = `<div class="card">Verbindungsfehler: ${e.message}</div>`;
    }
  }

  // ---- Rezepte laden ----
  let allRecipesCache = [];

  async function loadRecipes() {
    const listEl = document.getElementById('recipe-list');
    listEl.innerHTML = `<div class="muted">Lade Rezepte...</div>`;

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/recipes?select=id,titel,zutaten,anleitung,quelle_url,kopie_von,basis_portionen,zutaten_strukturiert,erstellt_am&order=erstellt_am.desc`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    const data = await res.json();
    allRecipesCache = data;

    if (!data.length) {
      listEl.innerHTML = `<div class="muted">Noch keine Rezepte gespeichert.</div>`;
      return;
    }

    const titelById = Object.fromEntries(data.map(r => [r.id, r.titel]));

    listEl.innerHTML = data.map(r => `
      <div class="progress-item" style="align-items: flex-start; flex-direction: column; cursor:pointer;" onclick="toggleRecipeDetail('${r.id}')">
        <div style="font-weight:600;">${r.titel}</div>
        ${r.kopie_von && titelById[r.kopie_von] ? `<div class="muted" style="font-size:0.8rem;">Kopie von "${titelById[r.kopie_von]}"</div>` : ''}
        ${r.zutaten ? `<div class="muted" style="margin-top:4px;">${r.zutaten}</div>` : ''}
        <div id="recipe-detail-${r.id}" style="display:none; width:100%; margin-top:10px;" onclick="event.stopPropagation()"></div>
      </div>
    `).join('');
  }

  // ---- Detail aufklappen/zuklappen ----
  function toggleRecipeDetail(id) {
    const detailEl = document.getElementById(`recipe-detail-${id}`);
    const isOpen = detailEl.style.display === 'block';
    // alle anderen offenen Details schließen, damit die Liste übersichtlich bleibt
    document.querySelectorAll('[id^="recipe-detail-"]').forEach(el => el.style.display = 'none');

    if (isOpen) return; // war offen -> jetzt zu, fertig

    const r = allRecipesCache.find(rec => rec.id === id);
    const hatStrukturierteZutaten = r.zutaten_strukturiert && r.zutaten_strukturiert.length > 0 && r.basis_portionen;
    const nurPortionenOhneStruktur = r.basis_portionen && !hatStrukturierteZutaten;

    detailEl.innerHTML = `
      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <div style="font-size:0.88rem; font-weight:600;">Zutaten</div>
        ${hatStrukturierteZutaten
          ? `<div style="display:flex; align-items:center; gap:10px; margin:6px 0;">
               <span class="muted" style="font-size:0.85rem;">Portionen:</span>
               <button style="width:auto; padding:2px 10px; background:none; border:1px solid var(--border); border-radius:6px; cursor:pointer;" onclick="changePortionen('${id}', -1)">-</button>
               <span id="portionen-anzeige-${id}" style="font-weight:600;">${r.basis_portionen}</span>
               <button style="width:auto; padding:2px 10px; background:none; border:1px solid var(--border); border-radius:6px; cursor:pointer;" onclick="changePortionen('${id}', 1)">+</button>
             </div>
             <div id="zutaten-liste-${id}"></div>`
          : `${nurPortionenOhneStruktur ? `<div class="muted" style="font-size:0.85rem; margin-bottom:4px;">Für ${r.basis_portionen} Portionen (keine automatische Mengenumrechnung, da Zutaten nicht strukturiert erfasst)</div>` : ''}
             <div class="muted" style="white-space:pre-wrap; margin-bottom:10px;">${r.zutaten || '(keine Zutaten gespeichert)'}</div>`}
        <div style="font-size:0.88rem; font-weight:600; margin-top:10px;">Anleitung</div>
        <div class="muted" style="white-space:pre-wrap; margin-bottom:10px;">${r.anleitung || '(keine Anleitung gespeichert)'}</div>
        <div style="font-size:0.88rem; font-weight:600;">Techniken</div>
        <div id="recipe-techniques-${id}" class="muted">Lade...</div>
        ${r.quelle_url ? `<div style="margin-top:8px;"><a href="${r.quelle_url}" target="_blank" style="color: var(--accent); font-size:0.85rem;">Quelle öffnen</a></div>` : ''}
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button style="width:auto; flex:1; padding:8px 12px; background:none; border:1px solid var(--border); border-radius:8px; cursor:pointer;" onclick="startEditAsCopy('${id}')">Bearbeiten (als Kopie)</button>
          <button style="width:auto; flex:1; padding:8px 12px; background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; cursor:pointer;" onclick="deleteRecipe('${id}')">Löschen</button>
        </div>
      </div>
    `;
    detailEl.style.display = 'block';
    if (hatStrukturierteZutaten) {
      aktuellePortionen[id] = r.basis_portionen;
      renderZutatenListe(id);
    }
    loadRecipeTechniquesForDetail(id);
  }

  // ---- Portionen ändern und Zutatenliste neu berechnen ----
  let aktuellePortionen = {};

  function changePortionen(id, delta) {
    const neu = Math.max(1, (aktuellePortionen[id] || 1) + delta);
    aktuellePortionen[id] = neu;
    document.getElementById(`portionen-anzeige-${id}`).textContent = neu;
    renderZutatenListe(id);
  }

  function renderZutatenListe(id) {
    const r = allRecipesCache.find(rec => rec.id === id);
    const faktor = aktuellePortionen[id] / r.basis_portionen;
    const listEl = document.getElementById(`zutaten-liste-${id}`);

    listEl.innerHTML = r.zutaten_strukturiert.map(z => {
      if (z.menge === null || z.menge === undefined) {
        return `<div class="kriterium"><span>${z.name}</span></div>`;
      }
      const neueMenge = z.menge * faktor;
      // sinnvoll runden: bei kleinen Mengen 1 Nachkommastelle, sonst ganze Zahl
      const anzeige = neueMenge < 10 ? Math.round(neueMenge * 10) / 10 : Math.round(neueMenge);
      return `<div class="kriterium"><span>${z.name}</span><span>${anzeige} ${z.einheit || ''}</span></div>`;
    }).join('');
  }

  // ---- Verknüpfte Techniken für die Detailansicht laden ----
  async function loadRecipeTechniquesForDetail(recipeId) {
    const el = document.getElementById(`recipe-techniques-${recipeId}`);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/recipe_techniques?select=techniques(name)&recipe_id=eq.${recipeId}`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    const rows = await res.json();
    const names = rows.map(r => r.techniques?.name).filter(Boolean);
    el.textContent = names.length ? names.join(', ') : '(keine zugeordnet)';
  }

  // ---- Bearbeiten als Kopie: Formular befüllen ----
  let editingCopyOf = null;

  function startEditAsCopy(id) {
    const r = allRecipesCache.find(rec => rec.id === id);
    editingCopyOf = {
      id: r.id,
      quelle_url: r.quelle_url || null,
      zutaten_strukturiert: r.zutaten_strukturiert || null,
      original_zutaten_text: r.zutaten || ''
    };

    document.getElementById('recipe-titel-input').value = r.titel;
    document.getElementById('recipe-zutaten').value = r.zutaten || '';
    document.getElementById('recipe-anleitung').value = r.anleitung || '';
    document.getElementById('recipe-portionen-input').value = r.basis_portionen || '';

    document.getElementById('edit-mode-original-title').textContent = r.titel;
    document.getElementById('edit-mode-banner').style.display = 'block';
    document.getElementById('edit-mode-mengen-hinweis').textContent = r.zutaten_strukturiert
      ? '(Mengenangaben werden mit übernommen, solange du die Zutaten nicht änderst)'
      : '';

    document.getElementById('recipe-titel-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelEditCopy() {
    editingCopyOf = null;
    document.getElementById('edit-mode-banner').style.display = 'none';
    document.getElementById('recipe-titel-input').value = '';
    document.getElementById('recipe-zutaten').value = '';
    document.getElementById('recipe-anleitung').value = '';
    document.getElementById('recipe-portionen-input').value = '';
    document.getElementById('edit-mode-mengen-hinweis').textContent = '';
  }

  // ---- Rezept löschen ----
  async function deleteRecipe(id) {
    if (!confirm('Dieses Rezept wirklich löschen? Zugehörige Techniken/dein Fortschritt bleiben erhalten.')) return;

    await fetch(`${SUPABASE_URL}/rest/v1/recipes?id=eq.${id}`, {
      method: "DELETE",
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
    });
    loadRecipes();
  }

  // ---- Techniken laden ----
  async function loadTechniques() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/techniques?select=id,name&order=name.asc`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
    });
    techniques = await res.json();
    renderTechniqueOptions(techniques);
  }

  // ---- Techniken-Dropdown befüllen (volle oder gefilterte Liste) ----
  function renderTechniqueOptions(list) {
    const select = document.getElementById('technique-select');
    select.innerHTML = `<option value="">Automatisch erkennen lassen</option>` +
      list.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  }

  // ---- Titel-Feld nur relevant, wenn kein Rezept gewählt ist ----
  function onTechniqueSelectChange() {
    // aktuell nur Platzhalter für spätere Erweiterungen, Sichtbarkeit steuert onReflectRecipeChange
  }

  // ---- Rezepte für die Reflexions-Auswahl laden ----
  async function loadRecipesForReflect() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/recipes?select=id,titel&order=erstellt_am.desc`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
    });
    const recipes = await res.json();
    const select = document.getElementById('reflect-recipe-select');
    const previousValue = select.value;
    select.innerHTML = `<option value="">Kein Rezept / freie Auswahl</option>` +
      recipes.map(r => `<option value="${r.id}">${r.titel}</option>`).join('');
    select.value = previousValue;
  }

  // ---- Bei Rezept-Auswahl: nur noch Titel-Feld ein-/ausblenden (Filterung entfällt, wird zum Kontext-Hinweis für K2) ----
  function onReflectRecipeChange() {
    const recipeId = document.getElementById('reflect-recipe-select').value;
    currentReflectRecipeId = recipeId || null;

    // Titel-Feld nur relevant, wenn kein Rezept gewählt ist (K4: Auto-Anlage eines Rezepts)
    document.getElementById('auto-titel-wrapper').style.display = recipeId ? 'none' : 'block';
  }

  // ---- Auto-Erkennungs-Zustand (K2-K4) ----
  let autoQueue = [];
  let autoQueueIndex = 0;
  let autoRecipeId = null;
  let autoBeschreibung = "";
  let autoVorschlag = null;

  // ---- Hilfsfunktion: ein reflect-technique-Aufruf ----
  async function callReflectTechnique(technique_id, beschreibung_text, reflection_id, recipe_id) {
    const body = { technique_id, modus: "voll", beschreibung_text };
    if (reflection_id) body.reflection_id = reflection_id;
    if (!reflection_id && recipe_id) body.recipe_id = recipe_id;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/reflect-technique`, {
      method: "POST",
      headers: { Authorization: `Bearer ${ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  // ---- Reflexion absenden (Rückfrage-Runde, explizite Technik, oder Auto-Erkennung starten) ----
  async function submitReflection() {
    const beschreibungInput = document.getElementById('beschreibung').value.trim();
    if (!beschreibungInput) return;

    const btn = document.getElementById('submit-btn');
    const statusLine = document.getElementById('status-line');
    btn.disabled = true;

    try {
      // Fall 1: laufende Rückfrage-Runde (egal ob manuell oder Teil der Auto-Queue)
      if (currentReflectionId) {
        statusLine.textContent = "Wird ausgewertet...";
        const data = await callReflectTechnique(currentTechniqueId, beschreibungInput, currentReflectionId, null);
        if (data.error) { statusLine.textContent = "Fehler: " + data.error; btn.disabled = false; return; }
        document.getElementById('beschreibung').value = "";

        if (!data.abgeschlossen) {
          currentReflectionId = data.reflection_id;
          renderResult(data.ergebnis_dieser_runde, false);
          statusLine.textContent = "Bitte beantworte die Rückfrage unten.";
        } else {
          renderResult(data.finaler_output, true, data.ergebnis, data.progress);
          currentReflectionId = null;
          if (autoQueue.length > 0) { await advanceAutoQueue(statusLine); }
          else { statusLine.textContent = "Reflexion abgeschlossen."; }
        }
        btn.disabled = false;
        return;
      }

      // Fall 2: explizite Technik gewählt -> Auto-Modus umgehen, normaler Einzel-Ablauf
      const gewaehlteTechnik = document.getElementById('technique-select').value;
      if (gewaehlteTechnik) {
        statusLine.textContent = "Wird ausgewertet...";
        const data = await callReflectTechnique(gewaehlteTechnik, beschreibungInput, null, currentReflectRecipeId);
        if (data.error) { statusLine.textContent = "Fehler: " + data.error; btn.disabled = false; return; }
        currentTechniqueId = gewaehlteTechnik;
        document.getElementById('beschreibung').value = "";

        if (!data.abgeschlossen) {
          currentReflectionId = data.reflection_id;
          renderResult(data.ergebnis_dieser_runde, false);
          statusLine.textContent = "Bitte beantworte die Rückfrage unten.";
        } else {
          renderResult(data.finaler_output, true, data.ergebnis, data.progress);
          statusLine.textContent = "Reflexion abgeschlossen.";
        }
        btn.disabled = false;
        return;
      }

      // Fall 3: Auto-Erkennung starten (K2)
      statusLine.textContent = "Erkenne Techniken...";
      document.getElementById('auto-detect-info').textContent = "";
      document.getElementById('reflect-vorschlag-card').innerHTML = "";

      const detectRes = await fetch(`${SUPABASE_URL}/functions/v1/detect-techniques-reflection`, {
        method: "POST",
        headers: { Authorization: `Bearer ${ANON_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ beschreibung_text: beschreibungInput, recipe_id: currentReflectRecipeId || undefined })
      });
      const detectData = await detectRes.json();

      if (detectData.error) { statusLine.textContent = "Fehler: " + detectData.error; btn.disabled = false; return; }
      if (!detectData.erkannte_technik_ids || detectData.erkannte_technik_ids.length === 0) {
        statusLine.textContent = "Keine bekannte Technik erkannt. Du kannst oben auch manuell eine Technik wählen.";
        btn.disabled = false;
        return;
      }

      autoQueue = detectData.erkannte_technik_ids;
      autoQueueIndex = 0;
      autoBeschreibung = beschreibungInput;
      autoVorschlag = detectData.neue_technik_vorschlag || null;

      // Rezept bestimmen: gewähltes nehmen, oder neu anlegen (K4)
      if (currentReflectRecipeId) {
        autoRecipeId = currentReflectRecipeId;
      } else {
        const titelInput = document.getElementById('auto-titel-input').value.trim();
        const titel = titelInput || `Spontan gekocht - ${new Date().toLocaleDateString('de-DE')}`;
        const recipeRes = await fetch(`${SUPABASE_URL}/rest/v1/recipes`, {
          method: "POST",
          headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, "Content-Type": "application/json", Prefer: "return=representation" },
          body: JSON.stringify({ titel, anleitung: beschreibungInput, zutaten: null })
        });
        const [neuesRezept] = await recipeRes.json();
        autoRecipeId = neuesRezept.id;
        currentReflectRecipeId = autoRecipeId;
        loadRecipesForReflect();
      }

      // Erkannte Techniken mit dem Rezept verknüpfen (nur die, die noch fehlen)
      const existingRes = await fetch(`${SUPABASE_URL}/rest/v1/recipe_techniques?select=technique_id&recipe_id=eq.${autoRecipeId}`, {
        headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
      });
      const existingIds = new Set((await existingRes.json()).map(r => r.technique_id));
      const neueVerknuepfungen = autoQueue.filter(id => !existingIds.has(id)).map(id => ({ recipe_id: autoRecipeId, technique_id: id }));
      if (neueVerknuepfungen.length > 0) {
        await fetch(`${SUPABASE_URL}/rest/v1/recipe_techniques`, {
          method: "POST",
          headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(neueVerknuepfungen)
        });
      }

      document.getElementById('beschreibung').value = "";
      await startQueueItem(statusLine);
    } catch (e) {
      statusLine.textContent = "Verbindungsfehler: " + e.message;
    }
    btn.disabled = false;
  }

  // ---- Aktuelles Element der Auto-Queue starten ----
  async function startQueueItem(statusLine) {
    const techId = autoQueue[autoQueueIndex];
    const techName = techniques.find(t => t.id === techId)?.name || techId;
    document.getElementById('auto-detect-info').textContent = `Technik ${autoQueueIndex + 1} von ${autoQueue.length}: ${techName}`;
    statusLine.textContent = "Wird ausgewertet...";

    currentTechniqueId = techId;
    const data = await callReflectTechnique(techId, autoBeschreibung, null, autoRecipeId);
    if (data.error) { statusLine.textContent = "Fehler: " + data.error; return; }

    if (!data.abgeschlossen) {
      currentReflectionId = data.reflection_id;
      renderResult(data.ergebnis_dieser_runde, false);
      statusLine.textContent = "Bitte beantworte die Rückfrage unten.";
    } else {
      currentReflectionId = null;
      renderResult(data.finaler_output, true, data.ergebnis, data.progress);
      await advanceAutoQueue(statusLine);
    }
  }

  // ---- Nach Abschluss einer Technik: nächste starten, oder fertig ----
  async function advanceAutoQueue(statusLine) {
    autoQueueIndex++;
    if (autoQueueIndex < autoQueue.length) {
      await startQueueItem(statusLine);
    } else {
      document.getElementById('auto-detect-info').textContent = `Alle ${autoQueue.length} erkannten Techniken reflektiert.`;
      statusLine.textContent = "Fertig!";
      if (autoVorschlag) {
        renderNeueTechnikVorschlag(autoVorschlag, autoRecipeId, 'reflect-vorschlag-card');
      }
      loadRecipes();
      autoQueue = [];
      autoQueueIndex = 0;
      autoRecipeId = null;
      autoVorschlag = null;
    }
  }

  // ---- Ergebnis darstellen ----
  let renderResultKriterienListe = [];
  let quickAntworten = {};

  function renderResult(output, abgeschlossen, ergebnis, progress) {
    const card = document.getElementById('result-card');
    let html = `<div class="card">`;
    renderResultKriterienListe = output.kriterien_bewertung || [];
    quickAntworten = {};

    if (output.kriterien_bewertung && output.kriterien_bewertung.length > 0) {
      html += output.kriterien_bewertung.map((k, idx) => {
        const zeigtButtons = !abgeschlossen && k.status === 'unklar';
        return `
        <div class="kriterium" style="${zeigtButtons ? 'flex-direction:column; align-items:flex-start; gap:6px;' : ''}">
          <span>${k.kriterium}</span>
          ${zeigtButtons
            ? `<div style="display:flex; gap:6px;">
                 <button type="button" onclick="setQuickAntwort(${idx}, 'ja', this)" style="width:auto; padding:4px 12px; font-size:0.85rem; border-radius:6px; border:1px solid var(--border); background:none; cursor:pointer;">Ja</button>
                 <button type="button" onclick="setQuickAntwort(${idx}, 'nein', this)" style="width:auto; padding:4px 12px; font-size:0.85rem; border-radius:6px; border:1px solid var(--border); background:none; cursor:pointer;">Nein</button>
                 <button type="button" onclick="setQuickAntwort(${idx}, 'unsicher', this)" style="width:auto; padding:4px 12px; font-size:0.85rem; border-radius:6px; border:1px solid var(--border); background:none; cursor:pointer;">Weiß nicht</button>
               </div>`
            : `<span class="badge ${k.status}">${k.status.replace('_', ' ')}</span>`}
        </div>
      `;
      }).join('');
    }

    if (output.fehler_erkannt && output.fehler_erkannt.length > 0) {
      html += `<div class="fehler-liste"><strong>Beobachtung:</strong> ${output.fehler_erkannt.join(' ')}</div>`;
    }

    if (output.gesamteinschaetzung) {
      html += `<p style="margin-top:14px;">${output.gesamteinschaetzung}</p>`;
    }

    if (!abgeschlossen && output.rueckfrage) {
      html += `<div class="rueckfrage-box"><strong>Rückfrage:</strong> ${output.rueckfrage}</div>`;
    }

    if (!abgeschlossen && output.kriterien_bewertung?.some(k => k.status === 'unklar')) {
      html += `
        <div style="margin-top:10px;">
          <textarea id="quick-antwort-notiz" placeholder="Weitere Anmerkungen (optional)" style="min-height:60px; width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); font-family:inherit;"></textarea>
          <button class="primary" style="margin-top:8px;" onclick="submitQuickAntworten()">Antwort senden</button>
        </div>
      `;
    }

    if (abgeschlossen) {
      const labels = {
        sauber_bestaetigt: "✅ Sauber bestätigt",
        unklar_geblieben: "❔ Unklar geblieben",
        fehler_erkannt: "⚠️ Fehler erkannt",
        technischer_fehler: "⚠️ Technischer Fehler"
      };
      html += `<p style="margin-top:14px; font-weight:600;">${labels[ergebnis] || ergebnis}</p>`;
      if (progress) {
        html += `<p class="muted">Level ${progress.level} · ${progress.sauber_bestaetigt_count}x sauber bestätigt · ${progress.angewendet_count}x angewendet</p>`;
      }
    }

    html += `</div>`;
    card.innerHTML = html;
  }

  // ---- Ja/Nein/Weiß-nicht-Auswahl merken, Button optisch hervorheben ----
  function setQuickAntwort(idx, wert, btnEl) {
    const kriteriumText = renderResultKriterienListe[idx]?.kriterium;
    if (!kriteriumText) return;
    quickAntworten[idx] = { text: kriteriumText, wert };

    btnEl.parentElement.querySelectorAll('button').forEach(b => {
      b.style.background = 'none';
      b.style.color = 'var(--ink)';
      b.style.borderColor = 'var(--border)';
    });
    btnEl.style.background = 'var(--accent)';
    btnEl.style.color = 'white';
    btnEl.style.borderColor = 'var(--accent)';
  }

  // ---- Aus den Ja/Nein-Antworten einen Antworttext zusammensetzen und absenden ----
  function submitQuickAntworten() {
    const praefix = { ja: 'Ja', nein: 'Nein', unsicher: 'Unsicher' };
    const zeilen = Object.values(quickAntworten).map(a => `${praefix[a.wert]}: ${a.text}`);

    const notizEl = document.getElementById('quick-antwort-notiz');
    const notiz = notizEl ? notizEl.value.trim() : '';
    if (notiz) zeilen.push(notiz);

    if (zeilen.length === 0) return; // nichts ausgewählt und keine Notiz -> nichts zu senden

    document.getElementById('beschreibung').value = zeilen.join('\n');
    submitReflection();
  }

  // ---- Fortschritt laden ----
  async function loadProgress() {
    const listEl = document.getElementById('progress-list');
    listEl.innerHTML = `<div class="muted">Lade Fortschritt...</div>`;

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/techniques?select=id,name,technique_progress(level,angewendet_count,sauber_bestaetigt_count)&order=name.asc`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    const data = await res.json();

    listEl.innerHTML = data.map(t => {
      const p = (t.technique_progress && t.technique_progress[0]) || { level: 0, angewendet_count: 0, sauber_bestaetigt_count: 0 };
      const dots = [0, 1, 2, 3].map(i => `<span class="dot ${i <= p.level ? 'filled' : ''}"></span>`).join('');
      return `
        <div class="progress-item">
          <div>
            <div>${t.name}</div>
            <div class="muted">${p.sauber_bestaetigt_count}x sauber bestätigt · ${p.angewendet_count}x angewendet</div>
          </div>
          <div class="level-dots">${dots}</div>
        </div>
      `;
    }).join('');
  }

  // ---- Verlauf: alle abgeschlossenen Reflexionen chronologisch ----
  let historyCache = [];

  async function loadHistory() {
    const listEl = document.getElementById('history-list');
    listEl.innerHTML = `<div class="muted">Lade Verlauf...</div>`;

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/reflections?select=id,ergebnis,finaler_output,erstellt_am,techniques(name),recipes(titel)&finaler_output=not.is.null&order=erstellt_am.desc&limit=50`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    const data = await res.json();
    historyCache = data;

    if (!data.length) {
      listEl.innerHTML = `<div class="muted">Noch keine abgeschlossenen Reflexionen.</div>`;
      return;
    }

    const labels = {
      sauber_bestaetigt: "✅ Sauber bestätigt",
      unklar_geblieben: "❔ Unklar geblieben",
      fehler_erkannt: "⚠️ Fehler erkannt",
      technischer_fehler: "⚠️ Technischer Fehler"
    };

    listEl.innerHTML = data.map((r, i) => {
      const datum = new Date(r.erstellt_am).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      return `
        <div class="progress-item" style="align-items:flex-start; flex-direction:column; cursor:pointer;" onclick="toggleHistoryDetail(${i})">
          <div style="display:flex; justify-content:space-between; width:100%;">
            <div style="font-weight:600;">${r.techniques?.name || '(gelöschte Technik)'}</div>
            <div class="muted" style="font-size:0.8rem;">${datum}</div>
          </div>
          ${r.recipes?.titel ? `<div class="muted" style="font-size:0.85rem;">${r.recipes.titel}</div>` : ''}
          <div style="font-size:0.85rem; margin-top:4px;">${labels[r.ergebnis] || r.ergebnis || ''}</div>
          <div id="history-detail-${i}" style="display:none; width:100%; margin-top:10px;"></div>
        </div>
      `;
    }).join('');
  }

  function toggleHistoryDetail(i) {
    const el = document.getElementById(`history-detail-${i}`);
    const isOpen = el.style.display === 'block';
    document.querySelectorAll('[id^="history-detail-"]').forEach(e => e.style.display = 'none');
    if (isOpen) return;

    const output = historyCache[i].finaler_output;
    let html = `<div style="border-top:1px solid var(--border); padding-top:10px;">`;
    if (output.kriterien_bewertung && output.kriterien_bewertung.length > 0) {
      html += output.kriterien_bewertung.map(k => `
        <div class="kriterium"><span>${k.kriterium}</span><span class="badge ${k.status}">${k.status.replace('_',' ')}</span></div>
      `).join('');
    }
    if (output.fehler_erkannt && output.fehler_erkannt.length > 0) {
      html += `<div class="fehler-liste">${output.fehler_erkannt.join(' ')}</div>`;
    }
    if (output.gesamteinschaetzung) {
      html += `<p style="margin-top:10px; font-size:0.9rem;">${output.gesamteinschaetzung}</p>`;
    }
    html += `</div>`;
    el.innerHTML = html;
    el.style.display = 'block';
  }

  loadTechniques();
</script>
</body>
</html>
